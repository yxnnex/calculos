<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Billetera Virtual - Control de Gastos</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Estilos de Fondo y Cristal / Glassmorphism */
    body {
      background: radial-gradient(circle at top left, #2e1065, #0f172a, #030712);
      min-height: 100vh;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36);
      border-radius: 24px;
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      color: white;
    }

    .glass-input:focus {
      outline: none;
      border-color: rgba(168, 85, 247, 0.6);
      background: rgba(255, 255, 255, 0.1);
    }

    .glass-button {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.6), rgba(124, 58, 237, 0.6));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }

    .glass-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
    }
  </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-center">

  <div class="max-w-4xl w-full space-y-6">
    
    <!-- Encabezado HUD -->
    <header class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-2">
          <i data-lucide="wallet" class="text-purple-400"></i> Mi Billetera
        </h1>
        <p class="text-xs text-slate-400 mt-1">HUD de Control Financiero Personal</p>
      </div>
      <span class="text-xs px-3 py-1.5 rounded-full glass-card border border-purple-500/30 text-purple-300 font-medium">
        iOS Glass Style
      </span>
    </header>

    <!-- Widgets Superiores (Módulos de Saldo) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- Total Disponible -->
      <div class="glass-card p-5 relative overflow-hidden">
        <div class="flex justify-between items-start">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total en Mano</span>
          <div class="p-2 rounded-xl bg-emerald-500/20 text-emerald-400">
            <i data-lucide="arrow-down-left" class="w-5 h-5"></i>
          </div>
        </div>
        <div class="mt-4">
          <h2 id="total-ingresos" class="text-3xl font-bold text-emerald-400">$0</h2>
        </div>
      </div>

      <!-- Total Gastos -->
      <div class="glass-card p-5 relative overflow-hidden">
        <div class="flex justify-between items-start">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Gastos Totales</span>
          <div class="p-2 rounded-xl bg-rose-500/20 text-rose-400">
            <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
          </div>
        </div>
        <div class="mt-4">
          <h2 id="total-gastos" class="text-3xl font-bold text-rose-400">$0</h2>
        </div>
      </div>

      <!-- Restante / Disponible Real -->
      <div class="glass-card p-5 relative overflow-hidden">
        <div class="flex justify-between items-start">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Restante Disponible</span>
          <div class="p-2 rounded-xl bg-purple-500/20 text-purple-400">
            <i data-lucide="scale" class="w-5 h-5"></i>
          </div>
        </div>
        <div class="mt-4">
          <h2 id="total-restante" class="text-3xl font-bold text-purple-300">$0</h2>
        </div>
      </div>

    </div>

    <!-- Formulario para Agregar Movimientos -->
    <section class="glass-card p-6">
      <h3 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-5 h-5 text-purple-400"></i> Registrar Movimiento
      </h3>
      <form id="form-movimiento" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs text-slate-300 mb-1">Descripción</label>
          <input type="text" id="desc" placeholder="Ej: Fibertel, Steam..." required class="w-full rounded-xl p-2.5 text-sm glass-input">
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1">Monto ($)</label>
          <input type="number" id="monto" placeholder="0.00" min="0" step="any" required class="w-full rounded-xl p-2.5 text-sm glass-input">
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1">Categoría</label>
          <select id="categoria" class="w-full rounded-xl p-2.5 text-sm glass-input bg-slate-900/80">
            <option value="ingreso">💰 Dinero en Mano (Ingreso)</option>
            <option value="internet">🌐 Internet y Servicios (Fijo)</option>
            <option value="cuotas">💳 Cuotas a Pagar (Fijo)</option>
            <option value="juegos">🎮 Juegos y Suscripciones</option>
            <option value="kiosco">🍬 Kiosco / Gastos Diarios</option>
            <option value="otros">📦 Otros Gastos</option>
          </select>
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full py-2.5 px-4 rounded-xl font-semibold text-sm glass-button flex items-center justify-center gap-2 text-white">
            <i data-lucide="check" class="w-4 h-4"></i> Agregar
          </button>
        </div>
      </form>
    </section>

    <!-- Lista de Movimientos por Categorías -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Panel de Gastos Fijos -->
      <div class="glass-card p-6 space-y-4">
        <div class="flex justify-between items-center border-b border-white/10 pb-3">
          <h3 class="text-md font-semibold text-white flex items-center gap-2">
            <i data-lucide="calendar" class="w-4 h-4 text-sky-400"></i> Gastos Fijos Mensuales
          </h3>
          <span class="text-xs text-slate-400">Internet, Cuotas...</span>
        </div>
        <div id="lista-fijos" class="space-y-3">
          <p class="text-xs text-slate-500 italic text-center py-4">Sin gastos fijos registrados</p>
        </div>
      </div>

      <!-- Panel de Gastos Variables -->
      <div class="glass-card p-6 space-y-4">
        <div class="flex justify-between items-center border-b border-white/10 pb-3">
          <h3 class="text-md font-semibold text-white flex items-center gap-2">
            <i data-lucide="shopping-bag" class="w-4 h-4 text-pink-400"></i> Gastos Variables
          </h3>
          <span class="text-xs text-slate-400">Kiosco, Juegos...</span>
        </div>
        <div id="lista-variables" class="space-y-3">
          <p class="text-xs text-slate-500 italic text-center py-4">Sin gastos variables registrados</p>
        </div>
      </div>

    </section>

  </div>

  <script>
    // Lucide Icons Init
    lucide.createIcons();

    // Estado local
    let movimientos = JSON.parse(localStorage.getItem('billetera_movimientos')) || [];

    const form = document.getElementById('form-movimiento');
    const totalIngresosEl = document.getElementById('total-ingresos');
    const totalGastosEl = document.getElementById('total-gastos');
    const totalRestanteEl = document.getElementById('total-restante');
    const listaFijos = document.getElementById('lista-fijos');
    const listaVariables = document.getElementById('lista-variables');

    const categoriaBadges = {
      ingreso: { label: 'Ingreso', color: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' },
      internet: { label: 'Internet', color: 'bg-sky-500/20 text-sky-300 border-sky-500/30' },
      cuotas: { label: 'Cuotas', color: 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30' },
      juegos: { label: 'Juegos', color: 'bg-purple-500/20 text-purple-300 border-purple-500/30' },
      kiosco: { label: 'Kiosco', color: 'bg-pink-500/20 text-pink-300 border-pink-500/30' },
      otros: { label: 'Otros', color: 'bg-slate-500/20 text-slate-300 border-slate-500/30' }
    };

    function guardarYActualizar() {
      localStorage.setItem('billetera_movimientos', JSON.stringify(movimientos));
      render();
    }

    function agregarMovimiento(e) {
      e.preventDefault();
      const desc = document.getElementById('desc').value.trim();
      const monto = parseFloat(document.getElementById('monto').value);
      const categoria = document.getElementById('categoria').value;

      if (!desc || isNaN(monto)) return;

      const nuevoMovimiento = {
        id: Date.now(),
        desc,
        monto,
        categoria
      };

      movimientos.push(nuevoMovimiento);
      guardarYActualizar();
      form.reset();
    }

    function eliminarMovimiento(id) {
      movimientos = movimientos.filter(m => m.id !== id);
      guardarYActualizar();
    }

    function render() {
      let ingresos = 0;
      let gastos = 0;

      listaFijos.innerHTML = '';
      listaVariables.innerHTML = '';

      let fijosCount = 0;
      let variablesCount = 0;

      movimientos.forEach(m => {
        if (m.categoria === 'ingreso') {
          ingresos += m.monto;
        } else {
          gastos += m.monto;
        }

        const badge = categoriaBadges[m.categoria] || categoriaBadges.otros;
        const isFijo = ['internet', 'cuotas'].includes(m.categoria);

        const cardHTML = `
          <div class="flex items-center justify-between p-3 rounded-2xl glass-card border border-white/5 hover:border-white/20 transition-all">
            <div class="flex items-center gap-3">
              <span class="text-xs px-2.5 py-1 rounded-full border ${badge.color} font-medium">
                ${badge.label}
              </span>
              <div>
                <p class="text-sm font-medium text-white">${m.desc}</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-sm font-bold ${m.categoria === 'ingreso' ? 'text-emerald-400' : 'text-slate-200'}">
                ${m.categoria === 'ingreso' ? '+' : '-'}$${m.monto.toLocaleString('es-AR')}
              </span>
              <button onclick="eliminarMovimiento(${m.id})" class="text-slate-500 hover:text-rose-400 transition-colors">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;

        if (isFijo) {
          listaFijos.innerHTML += cardHTML;
          fijosCount++;
        } else if (m.categoria !== 'ingreso') {
          listaVariables.innerHTML += cardHTML;
          variablesCount++;
        }
      });

      if (fijosCount === 0) {
        listaFijos.innerHTML = '<p class="text-xs text-slate-500 italic text-center py-4">Sin gastos fijos registrados</p>';
      }
      if (variablesCount === 0) {
        listaVariables.innerHTML = '<p class="text-xs text-slate-500 italic text-center py-4">Sin gastos variables registrados</p>';
      }

      const restante = ingresos - gastos;

      totalIngresosEl.textContent = `$${ingresos.toLocaleString('es-AR')}`;
      totalGastosEl.textContent = `$${gastos.toLocaleString('es-AR')}`;
      totalRestanteEl.textContent = `$${restante.toLocaleString('es-AR')}`;

      lucide.createIcons();
    }

    form.addEventListener('submit', agregarMovimiento);
    render();
  </script>
</body>
</html>
